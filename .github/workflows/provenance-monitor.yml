name: Provenance monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 1 * *"

permissions:
  contents: read

jobs:
  amd-devcloud-repository-bootstrap:
    name: AMD DevCloud repository bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed trust metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the direct AMD artifact with the reviewed receipt
        run: security/check_amd_devcloud_repository_bootstrap.sh
